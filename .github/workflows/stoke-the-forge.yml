name: Stoke the forge

on:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours, so the heat cools and rises with real activity
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**", "src/**"]

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Forge SVGs from live GitHub data
        run: node scripts/forge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the forge changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Stoke the forge"
          git push
