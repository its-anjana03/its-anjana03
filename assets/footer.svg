<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Made by hand, since 2019. FORGE Studio, Thinura Anjana.">
<style>
  .s{font-family:'GS', 'General Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif} .m{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, Menlo, monospace}
  @keyframes up{from{opacity:0;transform:translateY(12px)}}
  .up{animation:up .8s cubic-bezier(.22,1,.36,1) backwards}
  @keyframes fade{from{opacity:0}}
  .fade{animation:fade 1s ease-out backwards}
  @keyframes gx{from{transform:scaleX(0)}}
  .gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.4s cubic-bezier(.22,1,.36,1) backwards}
  @keyframes gy{from{transform:scaleY(0)}}
  .gy{transform-box:fill-box;transform-origin:50% 0;animation:gy 1.2s cubic-bezier(.65,0,.35,1) backwards}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .pulse{animation:pulse 2.2s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="2750" y1="80" x2="250" y2="2420"><stop offset="0" stop-color="#FFE7A6"/><stop offset="0.32" stop-color="#FFC247"/><stop offset="0.62" stop-color="#FF8A00"/><stop offset="0.86" stop-color="#7A3510"/><stop offset="1" stop-color="#2B2B2B"/></linearGradient></defs>
<line x1="36" x2="964" y1="16" y2="16" stroke="rgba(244,239,230,.12)"/>
<g transform="translate(479.8 32) scale(0.01367)" class="pulse"><path d="M2962,267L2499,0L1038,392L771,854L1234,1121L504,1317L0,2190L516,2488L1162,2314L1430,1851L2160,1656L2427,1193L1964,925L2695,729Z" fill="url(#heat)"/></g>
<text x="500" y="92" text-anchor="middle" class="m" font-size="10.5" letter-spacing="2.4" fill="#8A8378">MADE BY HAND, SINCE 2019 · © FORGE STUDIO · THINURA ANJANA</text>
</svg>
